<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Smart Supply Chain Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container my-5">
        <h1 class="text-center mb-4">Smart Supply Chain Tracker</h1>

        <a th:href="@{/showNewProductForm}" class="btn btn-primary mb-3">Add New Product</a>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Product Name</th>
                    <th>SKU</th>
                    <th>Price</th>
                    <th>Stock Quantity</th>
                    <th>Actions (Trigger Test)</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${listProducts}">
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.sku}"></td>
                    <td th:text="${product.price}"></td>

                    <td th:text="${product.stockQuantity}"
                        th:style="${product.stockQuantity < 10} ? 'color: red; font-weight: bold;' : ''">
                    </td>

                    <td>
                        <form action="#" th:action="@{/updateStock/{id}(id=${product.id})}" method="POST"
                            style="display:inline;">
                            <input type="hidden" name="amount" value="-1" />
                            <button type="submit" class="btn btn-danger btn-sm">Sell 1</button>
                        </form>

                        <form action="#" th:action="@{/updateStock/{id}(id=${product.id})}" method="POST"
                            style="display:inline;">
                            <input type="hidden" name="amount" value="5" />
                            <button type="submit" class="btn btn-success btn-sm">Restock 5</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
