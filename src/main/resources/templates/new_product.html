<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add New Product</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container my-5">
        <h2>Add New Product</h2>
        <form action="#" th:action="@{/saveProduct}" th:object="${product}" method="POST">

            <div class="mb-3">
                <input type="text" th:field="*{name}" placeholder="Product Name" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="text" th:field="*{sku}" placeholder="SKU (e.g. ORA-100)" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="number" step="0.01" th:field="*{price}" placeholder="Price" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="number" th:field="*{stockQuantity}" placeholder="Initial Stock" class="form-control"
                    required>
            </div>

            <button type="submit" class="btn btn-success">Save Product</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>

</html>
